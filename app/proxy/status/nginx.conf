# Status page of the Anodosys proxy, included into the Nginx of the status container (written by ads proxy).
# The Docker socket is reachable only through one fixed, read-only request: the list of all containers.
server {
    listen 8080 default_server;
    server_name _;

    root /etc/anodosys-status;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = / {
        try_files /index.html =404;
    }

    location = /systems.json {
        limit_except GET { deny all; }
        default_type application/json;
        alias /anodosys/systems.json;
    }

    location = /docker/containers {
        limit_except GET { deny all; }
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host "docker";
        # fixed upstream path and query, the arguments of the request are not passed on
        proxy_pass http://unix:/var/run/docker.sock:/containers/json?all=1;
    }

    location / {
        return 404;
    }
}
